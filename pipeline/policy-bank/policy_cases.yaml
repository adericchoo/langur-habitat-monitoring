# The policy case bank.
#
# One entry per case. A case is either an `instrument` (a law or programme in
# force in Vietnam that a manager can invoke) or a `precedent` (a place where a
# measure was tried, with what is known about the result).
#
# Fields
#   applies_when   Eligibility switches, matched against the hotspot's own
#                  attributes. Keys: driver, g_protected, licence, v_occupancy.
#                  A case with no entry for a key applies to every value.
#   fit_note       Why the case fits a hotspot whose attributes match.
#   fit_note_if_assumed
#                  Replaces fit_note when a switch's attribute is blank for the
#                  hotspot (e.g. licence status not yet known), so the brief never
#                  states the unknown as fact. Required for every switch on
#                  g_protected, licence or v_occupancy; a test enforces it.
#   home_sites     Site ids or names where this case is the arrangement already
#                  in place. There it is graded "in place" and the brief uses
#                  at_home_site instead of fit_note and the preconditions.
#   at_home_site   Required with home_sites: what to check at the home site.
#   plain_name     The case as a short noun phrase, for the plain-English overview.
#   plain_use      What raising it would do, as a clause after plain_name
#                  ("... would make the operator pay to restore the cleared site").
#   plain_home_name, plain_home_check
#                  Required with home_sites: the overview's wording there.
#   preconditions  What has to be true for the case to work at this hotspot.
#                  `check` tests a hotspot attribute; `status` is the curator's
#                  reading for Vietnam (met | partial | not_met | unknown).
#   outcome        in_force | positive | mixed | unmeasured
#   sources        Numbered in the order listed. The first source is the case's
#                  main source: the policy text itself where one was found in
#                  English. The overview links the case's name to it.
#                  title, url
#                  locator   Where in the source the quote sits (article and
#                            clause for a law, page or section otherwise).
#                  quote     Verbatim English from the source, under 15 words.
#                  checked   full_text: the whole source was read.
#                            passage: the passage around the quote was read in
#                            the source itself (a law's article, an abstract).
#                            search_excerpt: only a search-engine excerpt was
#                            read. Such a source may not carry a quote and is
#                            flagged in the brief.
#   [n] markers    In summary, evidence, limitations and precondition notes,
#                  [n] cites source n. Every claim in `evidence` carries one,
#                  every marker must resolve, and every source must be cited;
#                  a test enforces all three.
#   reviewed_by_svw  false until Save Vietnam's Wildlife has signed the entry off.
#
# Sources were read between 2026-11-19 and 2026-11-23. Quotes are kept short
# and the bank stores no full texts, so it can sit in a public repository.

bank_version: "0.5"

cases:
  - id: VN-MINERALS-2024
    kind: instrument
    jurisdiction: Vietnam
    name: Sites where mining is prohibited (Law on Geology and Minerals 2024, Article 26)
    plain_name: "the Minerals Law's ban on mining in special-use and protective forest"
    plain_use: "would make quarrying here a breach of an existing prohibition"
    summary: >
      Article 26 of the law names the sites where mining operations are
      prohibited. Special-use forest and protective forest are among them [1].
    evidence: >
      Law No. 54/2024/QH15 took effect on 1 July 2025 [2]. Article 26(1)(c)
      lists special-use forest and protective forest among the sites where
      mining operations are prohibited [1].
    outcome: in_force
    applies_when:
      driver: [mining]
      g_protected: [inside]
    fit_note: >
      Quarrying on special-use forest land falls inside the category the law
      names as prohibited, so the request to the province is to enforce an
      existing prohibition.
    fit_note_if_assumed:
      g_protected: >
        Whether the patch is inside a protected area is not yet known. If it
        is, quarrying there falls inside the category the law names as
        prohibited, and the request to the province is to enforce an existing
        prohibition.
    preconditions:
      - text: The patch is on land classified as special-use or protective forest
        check: {field: g_protected, in: [inside]}
      - text: The province's land records classify this land as special-use or protective forest
        status: unknown
        note: The forest classification of each patch has to come from the provincial Department of Agriculture and Environment.
    limitations: >
      The prohibition turns on how the land is classified. Forest land that has
      been reclassified for mining falls outside it, and the law text alone
      does not show which patches that applies to.
    sources:
      - title: "Apolat Legal: Law on Geology and Minerals No. 54/2024/QH15, English translation (PDF)"
        url: https://apolatlegal.com/wp-content/uploads/2025/07/LAW-GEOLOGY-AND-MINERALS.pdf
        locator: "Article 26(1)(c)"
        quote: "Special-use forest, protective forest; geological sanctuaries, marine sanctuaries as per the law"
        checked: passage
      - title: "Ministry of Industry and Trade: Completing the legal framework for mineral extraction activities"
        url: https://moit.gov.vn/en/news/completing-the-legal-framework-for-mineral-extraction-activities.html
        locator: "news item"
        quote: "54/2024/QH15, which took effect on July 1, 2025"
        checked: full_text
    reviewed_by_svw: false

  - id: VN-REMEDIATION-DEPOSIT
    kind: instrument
    jurisdiction: Vietnam
    name: Environmental remediation deposit for mineral extraction (Decree 08/2022/ND-CP, Article 37)
    plain_name: "the restoration deposit for quarries (Decree 08/2022)"
    plain_use: "would make the operator pay to restore the cleared site"
    summary: >
      A mineral operation pays a deposit so that environmental remediation of
      the site is funded. If the operator is dissolved or goes bankrupt, the
      authority that approved the mine closure plan uses the deposit to do the
      work [1].
    evidence: >
      Article 37 of Decree 08/2022/ND-CP governs paying and refunding the
      deposit for environmental remediation during mineral mining; under clause
      9 the deposit, with its interest, passes to the authority that approved
      the mine closure plan if the operator is dissolved or bankrupt [1]. In
      the former Kim Bang area, mineral projects in four localities were to end
      operations by 31 December 2025 and carry out soil rehabilitation and
      environmental restoration [2].
    outcome: in_force
    applies_when:
      driver: [mining]
      licence: ["0"]
    fit_note: >
      The patch is inside a known concession, so a deposit and a remediation
      plan should already exist. The request is for the province to check the
      plan covers the cleared forest and to hold the operator to it.
    fit_note_if_assumed:
      licence: >
        Whether the quarry holds a licence is not yet known. If it does, a
        deposit and a remediation plan should already exist, and the request
        is for the province to check the plan covers the cleared forest and to
        hold the operator to it. If it does not, this option falls away and
        the patch is an unlicensed operation.
    preconditions:
      - text: The quarry holds a licence, so a deposit and a remediation plan exist
        check: {field: g_unlicensed, in: ["0"]}
      - text: The deposit is large enough to pay for restoring karst forest
        status: unknown
        note: No source was found on deposit levels for limestone quarries in Ninh Binh.
    limitations: >
      The deposit pays for restoration after extraction. It does not stop the
      clearing, and restored quarry floor is not karst forest. The English
      translation predates later amendments to the Decree, so the current
      wording of Article 37 needs checking [1].
    sources:
      - title: "Winrock International: Law on Environmental Protection 2020 and Decree 08/2022/ND-CP, English translation (PDF)"
        url: https://winrock.org/wp-content/uploads/2023/02/LuatBVMT-Eng_20230203.pdf
        locator: "Decree 08/2022/ND-CP, Article 37(1)"
        quote: "provides adequate funding for environmental remediation and improvement"
        checked: passage
      - title: "Ninh Binh newspaper: Ninh Binh set to establish conservation area for endangered Delacour's langurs (8 Oct 2025)"
        url: https://en.baoninhbinh.org.vn/ninh-binh-set-to-establish-conservation-area-for-endangered-delacours-langurs-251008143543602.html
        locator: "news article"
        quote: "Those projects will also carry out soil rehabilitation and environmental restoration."
        checked: full_text
    reviewed_by_svw: false

  - id: VN-FORESTRY-2017
    kind: instrument
    jurisdiction: Vietnam
    name: Limits on repurposing natural forest (Law on Forestry 2017, Article 14)
    plain_name: "the Forestry Law's limits on clearing natural forest"
    plain_use: "would require the province to produce the approval for the clearing, or treat it as illegal"
    summary: >
      The law bars repurposing natural forest except for projects of national
      importance, defence and security projects, and urgent projects that meet
      Government criteria. It lists illegal felling, deforestation and
      encroachment among prohibited acts [1].
    evidence: >
      Law No. 16/2017/QH14 came into force on 1 January 2019 (Article 107) [1].
      Article 14(2) restricts repurposing natural forest to the project types
      above, Article 9(1) prohibits illegally felling, deforesting, exploiting
      or encroaching forests, and Article 20 gives provincial People's Councils
      the decision on approving forest repurposing guidelines [1].
    outcome: in_force
    applies_when:
      g_protected: [inside]
    fit_note: >
      Loss of natural forest inside a protected area is either an approved
      repurposing or a prohibited act. The request is for the province to say
      which, and to produce the approval if there is one.
    fit_note_if_assumed:
      g_protected: >
        Whether the patch is inside a protected area is not yet known. If it
        is, the loss of forest there is either an approved repurposing or a
        prohibited act, and the request is for the province to say which and
        to produce the approval if there is one.
    preconditions:
      - text: The patch is inside a protected area managed as special-use forest
        check: {field: g_protected, in: [inside]}
      - text: The forest protection station has the rangers to follow up on the ground
        status: partial
        note: A 2025 petition by five Vietnamese conservation organisations reported four rangers at the Kim Bang-Thanh Liem Forest Protection Station [2].
    limitations: >
      The law sets the rules for repurposing; it does not by itself show
      whether a given clearing was approved. Follow-up depends on ranger
      capacity, which conservation organisations reported as thin at Kim Bang
      [2].
    sources:
      - title: "Luat Minh Khue: Law on Forestry No. 16/2017/QH14, consolidated English text"
        url: https://luatminhkhue.vn/van-ban/tai-d33857.aspx
        locator: "Article 14(2)"
        quote: "Natural forests shall not be repurposed, except projects of national importance"
        checked: passage
      - title: "CCD, CEGORN, PanNature, GreenViet and WildAct: Petition on the Kim Bang Species and Habitat Conservation Area for the Delacour's Langur, English translation (1 Aug 2025)"
        url: https://www.nature.org.vn/en/wp-content/uploads/2025/08/Petition-Letter-RE-Kim-Bang-SCHA-2025-EN-Translation.pdf
        locator: "page 1"
        quote: "only four rangers currently work at the station"
        checked: full_text
    reviewed_by_svw: false

  - id: VN-PFES
    kind: instrument
    jurisdiction: Vietnam
    name: Payments for Forest Environmental Services (Law on Forestry 2017, Articles 61-63)
    plain_name: "payments for forest environmental services"
    plain_use: "would pay local households to keep the forest standing"
    summary: >
      Users of forest environmental services, among them hydroelectric
      producers and clean water suppliers, are required to pay for them, and
      the payments go to those who protect the forest [1].
    evidence: >
      Article 63(2) of the Forestry Law names hydroelectric producers, clean
      water suppliers and industrial producers among those required to pay
      [1]. A study in Son La reports that PFES contributes 25% of total
      investment in Vietnam's forestry sector, that its additionality is
      disputed and depends on whose data is used, and that it adds little
      income for individual villagers [2]. A study in Cat Tien National Park
      reported that 81.4% of poor participating households escaped poverty, by
      their own criteria, through forest protection income [3].
    outcome: mixed
    applies_when:
      driver: [farming]
    fit_note: >
      Where forest is being cleared for crops, a protection contract gives
      households an income for keeping it standing.
    preconditions:
      - text: A paying service user (hydropower, water supply or industry) draws on this forest
        status: unknown
        note: The payers are users of the forest's services [1]; whether the karst sites have one was not established.
      - text: The forest is allocated to households or a community who can sign a contract
        status: unknown
    limitations: >
      Evidence that PFES adds forest cover beyond what would have happened
      anyway is contested [2], and the Cat Tien study found weak monitoring and
      unreliable data [3]. Payments may not match what the cleared land earns
      under crops.
    sources:
      - title: "Luat Minh Khue: Law on Forestry No. 16/2017/QH14, consolidated English text"
        url: https://luatminhkhue.vn/van-ban/tai-d33857.aspx
        locator: "Article 63(2)"
        quote: "The following entities are required to make payments for forest environmental services"
        checked: passage
      - title: "Pham et al. (2020) The politics of numbers and additionality governing the national PFES scheme in Vietnam: a case study from Son La province. Forest and Society 4(2): 379-404 (doi:10.24259/fs.v4i2.10891)"
        url: https://scholarhub.unhas.ac.id/fs/vol4/iss2/1
        locator: "abstract"
        quote: "PFES has provided little additional income to individual villagers"
        checked: passage
      - title: "Pham et al. (2021) Impacts of Payment for Forest Environmental Services in Cat Tien National Park. Forests 12(7): 921 (doi:10.3390/f12070921)"
        url: https://agris.fao.org/search/en/records/6723593eb605bda15e0a6b38
        locator: "abstract"
        quote: "81.4% have escaped poverty, based on self-defined poverty criteria"
        checked: passage
    reviewed_by_svw: false

  - id: VN-VANLONG-COMMUNITY
    kind: precedent
    jurisdiction: Vietnam
    name: Community-backed reserve management at Van Long Nature Reserve
    plain_name: "the community-backed reserve management model from Van Long"
    plain_use: "would bring the surrounding communities into protecting the forest"
    plain_home_name: "Van Long's community-backed reserve management"
    plain_home_check: "the question is whether it is working: ask the reserve's management board whether it knew of the clearing and what enforcement followed"
    summary: >
      The reserve's management board has the mandate to make decisions in the
      reserve, and residents, some of them former hunters, take part in
      protection through community conservation teams [1].
    evidence: >
      The reserve held 60-67 Delacour's langurs when it was established in
      2001; recent counts are about 150-160 [1]. Van Long received Green List
      certification in 2020 [1].
    outcome: positive
    applies_when:
      g_protected: [inside, buffer]
    fit_note: >
      This is the one Delacour's langur population reported as growing, and it
      is in the same province and legal system as the flagged patch.
    fit_note_if_assumed:
      g_protected: >
        This is the one Delacour's langur population reported as growing, in
        the same province and legal system as the flagged patch. Its model
        works through a protected area and its buffer zone, and whether the
        patch lies in one is not yet known.
    home_sites: [van-long-dong-tam, Van Long]
    at_home_site: >
      This is the arrangement already running at Van Long, so the question is
      whether it is working for the flagged patches, not whether to adopt it.
      The request is for the reserve's management board to say whether it knew
      of the clearing, whether community patrols cover this part of the
      reserve or its buffer zone, and what enforcement followed.
    preconditions:
      - text: A management board with enforcement powers covers the site
        check: {field: g_protected, in: [inside]}
      - text: The surrounding communities support protection
        status: unknown
        note: Community support has to be established site by site.
      - text: Long-term funding from donors and government is in place
        status: unknown
    limitations: >
      The same source reports that the reserve is affected by smoke, dust and
      waste from the nearby Gian Khau Industrial Zone [1], so the model has not
      been shown to hold back industrial pressure such as quarrying.
    sources:
      - title: "PANORAMA Solutions: Conservation of Delacour's Langur in Van Long Wetland Nature Reserve, Vietnam"
        url: https://panorama.solutions/fr/node/5880
        locator: "case-study page"
        quote: "Recent counts confirmed c. 150-160 individuals of this langur"
        checked: full_text
    reviewed_by_svw: false

  - id: VN-KIMBANG-DESIGNATION
    kind: precedent
    jurisdiction: Vietnam
    name: Designating unprotected langur habitat as a conservation area (Kim Bang)
    plain_name: "a conservation-area designation like Kim Bang's"
    plain_use: "would put the forest under a conservation management board"
    plain_home_name: "Kim Bang's conservation-area designation (November 2026)"
    plain_home_check: "the first step is to check whether the flagged patches fall inside the new boundary, which the data behind this run predates"
    summary: >
      Ninh Binh province established the Kim Bang Delacour's Langur Species and
      Habitat Conservation Area, divided into strictly protected, ecological
      restoration, and service and administrative zones, and assigned the
      provincial Special-use and Protection Forest Management Board to manage
      it [1].
    evidence: >
      The decision was announced in November 2026; the area covers 3,182 ha,
      including over 3,016 ha of natural limestone forest [1]. Conservation
      organisations and government agencies had proposed it since 2016 [4],
      and five organisations petitioned the Prime Minister, the Minister of
      Agriculture and Environment and the provincial chair for it on 1 August
      2025 [3]. Mining sites within the planned reserve were excluded, and
      mineral projects in four localities of the former Kim Bang area were to
      end operations by 31 December 2025 [2].
    outcome: positive
    applies_when:
      driver: [mining]
      g_protected: [outside, buffer]
    fit_note: >
      The patch is quarry expansion on langur habitat without reserve status,
      which is the situation Kim Bang was in before designation.
    fit_note_if_assumed:
      g_protected: >
        Whether the patch has reserve status is not yet known. If it has none,
        it is quarry expansion on langur habitat without protection, which is
        the situation Kim Bang was in before designation.
    home_sites: [kim-bang, Kim Bang]
    at_home_site: >
      Kim Bang was designated a conservation area in November 2026, after this
      run's classification period, and the protected-area layer used to score
      these patches predates it, so they read as outside any protected area.
      The request is to check each flagged patch against the new boundary. A
      patch inside it now falls under the conservation area's management board;
      a patch on land excluded with the mining sites is the kind of gap the
      designation left open.
    preconditions:
      - text: Surveys confirm langurs at the site
        check: {field: v_occupancy, in: [confirmed]}
      - text: The provincial People's Committee is willing to designate
        status: partial
        note: Ninh Binh has now done this once [1]. Four of the seven langur sites sit under the same province.
      - text: Conservation organisations sustain the case over several years
        status: partial
        note: Kim Bang took about ten years from first proposal to decision [4].
    limitations: >
      Mining sites within the planned reserve were excluded from it [2].
      Designation is too recent for any effect on the langur population or the
      forest to have been measured.
    sources:
      - title: "VietnamPlus: Ninh Binh establishes world's largest Delacour's langur sanctuary (6 Nov 2026)"
        url: https://en.vietnamplus.vn/ninh-binh-establishes-worlds-largest-delacours-langur-sanctuary-post354875.vnp
        locator: "news article"
        quote: "the conservation area covers 3,182ha, including over 3,016ha of natural limestone forest"
        checked: full_text
      - title: "Ninh Binh newspaper: Ninh Binh set to establish conservation area for endangered Delacour's langurs (8 Oct 2025)"
        url: https://en.baoninhbinh.org.vn/ninh-binh-set-to-establish-conservation-area-for-endangered-delacours-langurs-251008143543602.html
        locator: "news article"
        quote: "mining sites within the planned reserve have been excluded"
        checked: full_text
      - title: "CCD, CEGORN, PanNature, GreenViet and WildAct: Petition on the Kim Bang Species and Habitat Conservation Area for the Delacour's Langur, English translation (1 Aug 2025)"
        url: https://www.nature.org.vn/en/wp-content/uploads/2025/08/Petition-Letter-RE-Kim-Bang-SCHA-2025-EN-Translation.pdf
        locator: "recommendation (1)"
        quote: "Urgently establish the Kim Bang Species and Habitat Conservation Area"
        checked: full_text
      - title: "The Star: Petition submitted to set up conservation area for rare langur species in Ninh Binh (2 Aug 2025)"
        url: https://www.thestar.com.my/aseanplus/aseanplus-news/2025/08/02/petition-submitted-to-set-up-conservation-area-for-rare-langur-species-in-ninh-bnh
        locator: "news article"
        quote: "Since 2016, conservation organisations and Government agencies have proposed establishing"
        checked: full_text
    reviewed_by_svw: false

  - id: CN-CHONGZUO-RESERVE
    kind: precedent
    jurisdiction: China
    name: Anti-poaching and a habitat conservation regulation for the white-headed langur (Chongzuo, Guangxi)
    plain_name: "the white-headed langur habitat regulation in Guangxi, China"
    plain_use: "would ban destroying or converting the langur's habitat"
    summary: >
      A sister limestone langur is protected through reduced poaching and a
      2021 habitat conservation regulation, enacted by the Chongzuo
      government, that bans habitat destruction and natural habitat conversion
      within the species' current range [1].
    evidence: >
      Surveys ten years apart counted 818 langurs in 105 groups (2010-2011) and
      1,183 in 128 groups (2020-2021); the authors find reduced poaching the
      strongest explanation for the increase [1]. Over the longer run the
      species' range fell from 200 km2 in 1999 to 99.3 km2 in 2021, and the
      population is split across six forest fragments separated by farmland
      and roads [1].
    outcome: mixed
    applies_when:
      driver: [farming, other]
    fit_note: >
      Same genus, same karst habitat, and the same pressure from farmland
      pushing onto the lower slopes.
    preconditions:
      - text: A reserve with enforcement staff covers the population
        check: {field: g_protected, in: [inside]}
      - text: A regulation specific to the species' habitat bans conversion within its range
        status: unknown
        note: No equivalent habitat regulation for Delacour's langur was found; the Kim Bang designation is a protected area, which is a different tool.
    limitations: >
      The population grew while its range halved [1], so this is evidence for
      anti-poaching enforcement more than for habitat protection. The source
      does not cover quarrying.
    sources:
      - title: "Tang et al. (2024) Population dynamics and conservation status of the white-headed langur in the Chongzuo forest fragments, Guangxi, China. Oryx 58(2): 179-182 (doi:10.1017/S0030605323000029)"
        url: https://www.cambridge.org/core/product/B751E7BDC269EE0C7CD8FB90BD29DCEB/core-reader
        locator: "main text"
        quote: "a marked reduction in poaching appears to offer the strongest explanation"
        checked: full_text
    reviewed_by_svw: false

  - id: IN-MINING-BUFFER-2023
    kind: precedent
    jurisdiction: India
    name: Fixed no-mining distance around protected areas (Supreme Court of India, 2023)
    plain_name: "India's fixed no-mining buffer around protected areas"
    plain_use: "would ban mining within a set distance of the protected area"
    summary: >
      India's Supreme Court held that mining is not permissible inside national
      parks and wildlife sanctuaries or within one kilometre of their
      boundaries [1].
    evidence: >
      Paragraph 65 of the Court's judgment of 26 April 2023 in the T.N.
      Godavarman case set the rule, and the order of 28 April 2023 restates it,
      noting that a ban earlier limited to Goa now applies across India [1]. The Court's order of 26 April 2023 relaxed the
      uniform one-kilometre eco-sensitive zone for other activities while
      keeping the mining ban, and noted that India has 104 national parks and
      558 wildlife sanctuaries [2].
    outcome: unmeasured
    applies_when:
      driver: [mining]
      g_protected: [buffer, outside]
    fit_note: >
      The patch is quarrying outside a protected-area boundary, which is the
      gap a fixed no-mining distance closes.
    fit_note_if_assumed:
      g_protected: >
        Whether the patch is inside a protected area is not yet known. If it
        lies outside the boundary, it is the gap a fixed no-mining distance
        closes.
    preconditions:
      - text: The patch is within a defined buffer of a protected-area boundary
        check: {field: g_protected, in: [buffer]}
      - text: A national body can impose one distance on every province
        status: unknown
        note: India's rule came from public-interest litigation in its Supreme Court [1]. No source was found for an equivalent route in Vietnam; the nearest equivalent would be a Government decree or a provincial decision.
    limitations: >
      No measurement of the ruling's effect on forest or wildlife was found.
      The Court relaxed the uniform zone for other activities [2], so the fixed
      distance survives only for mining.
    sources:
      - title: "Supreme Court of India: In re T.N. Godavarman Thirumulpad v. Union of India, order of 28 April 2023 (PDF)"
        url: https://main.sci.gov.in/supremecourt/1995/2997/2997_1995_8_55_44035_Judgement_28-Apr-2023.pdf
        locator: "order of 28 April 2023, quoting paragraph 65 of the judgment of 26 April 2023"
        quote: "within an area of one kilometre from the boundary of such National Park"
        checked: passage
      - title: "Down To Earth: Supreme Court modifies order on construction ban within one kilometre of protected areas (26 Apr 2023)"
        url: https://www.downtoearth.org.in/forests/supreme-court-modifies-order-on-construction-ban-within-one-kilometre-of-protected-areas-88982
        locator: "news report"
        quote: "There are 104 national parks and 558 wildlife sanctuaries in India"
        checked: full_text
    reviewed_by_svw: false
