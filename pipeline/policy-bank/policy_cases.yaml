# The policy case bank.
#
# One entry per case. A case is either an `instrument` (a law or programme in
# force in Vietnam that a manager can invoke) or a `precedent` (a place where a
# measure was tried, with what is known about the result).
#
# Fields
#   applies_when   Eligibility switches, matched against the hotspot's own
#                  attributes. Keys: driver, g_protected, licence, v_occupancy.
#                  A case with no entry for a key applies to every value.
#   preconditions  What has to be true for the case to work at this hotspot.
#                  `check` tests a hotspot attribute; `status` is the curator's
#                  reading for Vietnam (met | partial | not_met | unknown).
#   outcome        in_force | positive | mixed | unmeasured
#   sources        `checked: full_text` means the page itself was read;
#                  `checked: search_excerpt` means only the search excerpt was
#                  read and the article text still wants checking.
#   reviewed_by_svw  false until Save Vietnam's Wildlife has signed the entry off.
#
# Every figure in `evidence` comes from the listed sources. Sources were
# accessed on 2026-11-19.

bank_version: "0.1"

cases:
  - id: VN-MINERALS-2024
    kind: instrument
    jurisdiction: Vietnam
    name: Areas prohibited from mineral activities (Law on Geology and Minerals 2024)
    summary: >
      The law lets the State delineate areas where mineral activities are
      prohibited. Special-use forest land and protection forest land are among
      the grounds for prohibition.
    evidence: >
      Law No. 54/2024/QH15 was passed on 29 November 2024 and took effect on
      1 July 2025, replacing the 2010 Mineral Law. Article 26 lists special-use
      forest land and protection forest land among the areas where mineral
      activities are prohibited.
    outcome: in_force
    applies_when:
      driver: [mining]
      g_protected: [inside]
    fit_note: >
      Quarrying on special-use forest land falls inside the category the law
      names as prohibited, so the request to the province is to enforce an
      existing prohibition.
    preconditions:
      - text: The patch is on land classified as special-use or protection forest
        check: {field: g_protected, in: [inside]}
      - text: The province's delineated list of prohibited areas includes this land
        status: unknown
        note: The delineation is a provincial planning document; ask the provincial Department of Agriculture and Environment for the current map.
    limitations: >
      Licensing for construction-material minerals is delegated to the
      provincial People's Committee chair, so the body that licenses quarries
      is also the body asked to enforce the prohibition.
    sources:
      - title: "LawNet: Which areas are prohibited from mineral activities in Vietnam? (Article 26)"
        url: https://lawnet.vn/ngan-hang-phap-luat/en/tu-van-phap-luat/tai-nguyen--moi-truong/what-is-the-significance-of-january-8-which-areas-are-prohibited-from-mineral-activities-in-vietnam-1102286
        checked: search_excerpt
      - title: "IEA policy database: Law on Geology and Mineral Resources"
        url: https://www.iea.org/policies/18083-law-on-geology-and-mineral-resources
        checked: search_excerpt
      - title: "Vietnam Hoi Nhap: The Law on Geology and Minerals, the role of law enforcement organisation"
        url: https://vietnamhoinhap.vn/en/the-law-on-geology-and-minerals-the-critical-role-of-law-enforcement-organization-56613.htm
        checked: search_excerpt
    reviewed_by_svw: false

  - id: VN-REMEDIATION-DEPOSIT
    kind: instrument
    jurisdiction: Vietnam
    name: Environmental remediation deposit for mineral extraction (Decree 08/2022/ND-CP)
    summary: >
      A licensed mineral operation pays a deposit toward restoring the site.
      If the operator does not restore it, the authority that approves the mine
      closure plan can use the deposit to do the work.
    evidence: >
      The Law on Environmental Protection (No. 72/2020/QH14) took effect on
      1 January 2022. Article 37 of Decree 08/2022/ND-CP sets the deposit for
      environmental remediation in mineral mining. In Ninh Binh, the quarry
      projects ordered to stop by 31 December 2025 in the former Kim Bang area
      were required to rehabilitate soil and restore the environment before
      handing the land back.
    outcome: in_force
    applies_when:
      driver: [mining]
      licence: ["0"]
    fit_note: >
      The patch is inside a known concession, so a deposit and a remediation
      plan should already exist. The request is for the province to check the
      plan covers the cleared forest and to hold the operator to it.
    preconditions:
      - text: The quarry holds a licence, so a deposit and a remediation plan exist
        check: {field: g_unlicensed, in: ["0"]}
      - text: The deposit is large enough to pay for restoring karst forest
        status: unknown
        note: No source was found on deposit levels for limestone quarries in Ninh Binh.
    limitations: >
      The deposit pays for restoration after extraction. It does not stop the
      clearing, and restored quarry floor is not karst forest.
    sources:
      - title: "LawNet: Deposits on environmental remediation and improvement during mineral mining (Decree 08/2022/ND-CP, Article 37)"
        url: https://lawnet.vn/thong-tin-phap-luat/en/tu-van-luat/5-things-you-should-know-about-deposits-on-environmental-remediation-and-improvement-during-mineral-mining-in-vietnam-116530.html
        checked: search_excerpt
      - title: "Ninh Binh newspaper: Ninh Binh set to establish conservation area for endangered Delacour's langurs (8 Oct 2025)"
        url: https://en.baoninhbinh.org.vn/ninh-binh-set-to-establish-conservation-area-for-endangered-delacours-langurs-251008143543602.html
        checked: full_text
    reviewed_by_svw: false

  - id: VN-FORESTRY-2017
    kind: instrument
    jurisdiction: Vietnam
    name: Special-use forest protection and conversion approval (Law on Forestry 2017)
    summary: >
      Special-use forest carries the strongest protection of Vietnam's three
      forest categories. Converting natural forest to another use needs
      approval at National Assembly, Prime Minister or provincial level and has
      to conform to the forestry master plan.
    evidence: >
      Law No. 16/2017/QH14 was passed on 15 November 2017 and took effect on
      1 January 2019. It lists illegal felling, deforestation and encroachment
      among prohibited acts. Decree 83/2020/ND-CP sets the criteria and
      approval route for converting natural forest to another use.
    outcome: in_force
    applies_when:
      g_protected: [inside]
    fit_note: >
      Loss of forest inside a protected area is either an approved conversion
      or a prohibited act. The request is for the province to say which, and
      to produce the approval if there is one.
    preconditions:
      - text: The patch is inside a protected area managed as special-use forest
        check: {field: g_protected, in: [inside]}
      - text: The forest protection station has the rangers to follow up on the ground
        status: partial
        note: A 2025 petition by Vietnamese conservation organisations reported four rangers at the Kim Bang-Thanh Liem Forest Protection Station.
    limitations: >
      The law sets the approval route; it does not by itself show whether a
      given clearing was approved. Follow-up depends on ranger capacity.
    sources:
      - title: "FAOLEX: Forestry Law No. 16/2017/QH14"
        url: https://faolex.fao.org/en/documents/LEX-FAOC206322/forestry-law-no-16-2017-qh14-vnm-2017
        checked: search_excerpt
      - title: "LuatVietnam: Decree No. 83/2020/ND-CP amending Decree No. 156/2018/ND-CP"
        url: https://english.luatvietnam.vn/decree-no-83-2020-nd-cp-dated-july-15-2020-of-the-government-amending-and-supplementing-a-number-of-articles-of-the-governments-decree-no-156-2018-186731-doc1.html
        checked: search_excerpt
      - title: "PanNature: Petition regarding the Species and Habitat Conservation Area for the Delacour's Langur in Kim Bang (2025)"
        url: https://www.nature.org.vn/en/wp-content/uploads/2025/08/Petition-Letter-RE-Kim-Bang-SCHA-2025-EN-Translation.pdf
        checked: search_excerpt
    reviewed_by_svw: false

  - id: VN-PFES
    kind: instrument
    jurisdiction: Vietnam
    name: Payments for Forest Environmental Services (PFES)
    summary: >
      Hydropower plants and water supply companies pay fees that are passed on
      to the households and communities contracted to protect forest.
    evidence: >
      PFES has contributed about 25% of annual investment in Vietnam's forestry
      sector since 2008. A study in Cat Tien National Park reported that 81.4%
      of poor participating households escaped poverty, by their own
      definition, through forest protection income. A study in Son La found
      the scheme's effect on forest cover is disputed and depends on whose data
      is used, and that payments to individual villagers are small and not
      continuous.
    outcome: mixed
    applies_when:
      driver: [farming]
    fit_note: >
      Where forest is being cleared for crops, a protection contract gives
      households an income for keeping it standing.
    preconditions:
      - text: A paying service user (hydropower or water supply) draws on this forest
        status: unknown
        note: PFES money comes from service users in the same watershed; whether the karst sites have one was not established.
      - text: The forest is allocated to households or a community who can sign a contract
        status: unknown
    limitations: >
      Evidence that PFES adds forest cover beyond what would have happened
      anyway is contested. Payments may not match what the cleared land earns
      under crops.
    sources:
      - title: "CIFOR-ICRAF: The politics of numbers and additionality governing the national PFES scheme in Vietnam, a case study from Son La (doi:10.24259/fs.v4i2.10891)"
        url: https://www.cifor-icraf.org/knowledge/publication/7856
        checked: full_text
      - title: "CIFOR-ICRAF: Impacts of Payment for Forest Environmental Services in Cat Tien National Park"
        url: https://cifor-icraf.org/knowledge/publication/8092
        checked: search_excerpt
    reviewed_by_svw: false

  - id: VN-VANLONG-COMMUNITY
    kind: precedent
    jurisdiction: Vietnam
    name: Community-backed reserve management at Van Long Nature Reserve
    summary: >
      Local communities asked for the reserve and take part in protecting it.
      A multi-stakeholder management board set up in 2001 handles enforcement
      and community engagement, and residents, former hunters among them,
      patrol in community conservation teams.
    evidence: >
      The reserve held 60-67 Delacour's langurs when it was established in
      2001; recent counts are about 150-160. Van Long received IUCN Green List
      certification in 2020.
    outcome: positive
    applies_when:
      g_protected: [inside, buffer]
    fit_note: >
      This is the one Delacour's langur population reported as growing, and it
      is in the same province and legal system as the flagged patch.
    preconditions:
      - text: A management board with enforcement powers covers the site
        check: {field: g_protected, in: [inside]}
      - text: The surrounding communities support protection
        status: unknown
        note: Community support at Van Long predates the reserve; it has to be established site by site.
      - text: Long-term funding from donors and government is in place
        status: unknown
    limitations: >
      The gains at Van Long came mainly from stopping hunting. The same source
      reports continuing smoke, dust and waste from nearby cement factories, so
      the model has not been shown to hold back quarrying.
    sources:
      - title: "PANORAMA Solutions: Conservation of Delacour's Langur in Van Long Wetland Nature Reserve, Vietnam"
        url: https://panorama.solutions/fr/node/5880
        checked: full_text
    reviewed_by_svw: false

  - id: VN-KIMBANG-DESIGNATION
    kind: precedent
    jurisdiction: Vietnam
    name: Designating unprotected langur habitat as a conservation area (Kim Bang)
    summary: >
      Ninh Binh province established the Kim Bang Delacour's Langur Species and
      Habitat Conservation Area over limestone forest that had no reserve
      status, with strictly protected, ecological restoration and service
      zones under the provincial forest management board.
    evidence: >
      The decision was announced in November 2026. The area covers 3,182 ha,
      including over 3,016 ha of natural limestone forest. Conservation
      organisations had proposed it since 2016 and five of them petitioned the
      Prime Minister in August 2025. Mining sites were excluded from the
      boundary, and mineral projects in four localities of the former Kim Bang
      area were ordered to end by 31 December 2025 and restore the land.
    outcome: positive
    applies_when:
      driver: [mining]
      g_protected: [outside, buffer]
    fit_note: >
      The patch is quarry expansion on langur habitat without reserve status,
      which is the situation Kim Bang was in before designation.
    preconditions:
      - text: Surveys confirm langurs at the site
        check: {field: v_occupancy, in: [confirmed]}
      - text: The provincial People's Committee is willing to designate
        status: partial
        note: Ninh Binh has now done this once. Four of the seven langur sites sit under the same province.
      - text: Conservation organisations sustain the case over several years
        status: partial
        note: Kim Bang took about ten years from first proposal to decision.
    limitations: >
      Existing mining sites were drawn outside the boundary. Designation is
      too recent for any effect on the langur population or the forest to have
      been measured.
    sources:
      - title: "VietnamPlus: Ninh Binh establishes world's largest Delacour's langur sanctuary (Nov 2026)"
        url: https://en.vietnamplus.vn/ninh-binh-establishes-worlds-largest-delacours-langur-sanctuary-post354875.vnp
        checked: full_text
      - title: "Ninh Binh newspaper: Ninh Binh set to establish conservation area for endangered Delacour's langurs (8 Oct 2025)"
        url: https://en.baoninhbinh.org.vn/ninh-binh-set-to-establish-conservation-area-for-endangered-delacours-langurs-251008143543602.html
        checked: full_text
      - title: "PanNature: Joint petition calls for establishment of Species and Habitat Conservation Area for the Delacour's Langur in Kim Bang"
        url: https://www.nature.org.vn/en/joint-petition-calls-for-establishment-of-species-and-habitat-conservation-area/
        checked: search_excerpt
    reviewed_by_svw: false

  - id: CN-CHONGZUO-RESERVE
    kind: precedent
    jurisdiction: China
    name: National nature reserve and habitat regulation for the white-headed langur (Chongzuo, Guangxi)
    summary: >
      A sister limestone langur is protected by a national nature reserve,
      anti-poaching enforcement, and a 2021 habitat conservation regulation
      that bans habitat destruction and conversion inside the species' range.
    evidence: >
      Surveys ten years apart counted 818 langurs in 105 groups (2010-2011) and
      1,183 in 128 groups (2020-2021). The authors attribute the increase
      mainly to reduced poaching. Over the longer run the species' range fell
      from 200 km2 in 1999 to 99.3 km2 in 2021, and the population is split
      across six forest fragments separated by farmland and roads.
    outcome: mixed
    applies_when:
      driver: [farming, other]
    fit_note: >
      Same genus, same karst habitat, and the same pressure from farmland
      pushing onto the lower slopes.
    preconditions:
      - text: A reserve with enforcement staff covers the population
        check: {field: g_protected, in: [inside]}
      - text: A regulation specific to the species' habitat bans conversion within its range
        status: unknown
        note: No equivalent habitat regulation for Delacour's langur was found; the Kim Bang designation is a protected area, which is a different tool.
    limitations: >
      The population grew while its habitat halved, so this is evidence for
      anti-poaching enforcement more than for habitat protection. The source
      does not cover quarrying.
    sources:
      - title: "Tang et al. (2024) Population dynamics and conservation status of the white-headed langur in the Chongzuo forest fragments, Guangxi, China. Oryx 58(2): 179-182 (doi:10.1017/S0030605323000029)"
        url: https://www.cambridge.org/core/product/B751E7BDC269EE0C7CD8FB90BD29DCEB/core-reader
        checked: full_text
    reviewed_by_svw: false

  - id: IN-MINING-BUFFER-2023
    kind: precedent
    jurisdiction: India
    name: Fixed no-mining distance around protected areas (Supreme Court of India, 2023)
    summary: >
      India's Supreme Court ruled that mining is not permissible inside
      national parks and wildlife sanctuaries or within one kilometre of their
      boundaries, and that where a declared eco-sensitive zone is wider than
      one kilometre the ban covers the wider zone.
    evidence: >
      The ruling was given on 26 April 2023 in the T.N. Godavarman case,
      modifying an order of 3 June 2022, and clarified on 28 April 2023. It
      applies across India's 104 national parks and 558 wildlife sanctuaries.
    outcome: unmeasured
    applies_when:
      driver: [mining]
      g_protected: [buffer, outside]
    fit_note: >
      The patch is quarrying outside a protected-area boundary, which is the
      gap a fixed no-mining distance closes.
    preconditions:
      - text: The patch is within a defined buffer of a protected-area boundary
        check: {field: g_protected, in: [buffer]}
      - text: A national body can impose one distance on every province
        status: unknown
        note: India's rule came from public-interest litigation in its Supreme Court. No source was found for an equivalent route in Vietnam; the nearest equivalent would be a Government decree or a provincial decision.
    limitations: >
      No measurement of the ruling's effect on forest or wildlife was found.
      The earlier uniform one-kilometre zone was criticised by experts in India
      as lacking a site-by-site scientific basis.
    sources:
      - title: "Down To Earth: Supreme Court modifies order on construction ban within one kilometre of protected areas (26 Apr 2023)"
        url: https://www.downtoearth.org.in/forests/supreme-court-modifies-order-on-construction-ban-within-one-kilometre-of-protected-areas-88982
        checked: search_excerpt
      - title: "Supreme Court of India: In re T.N. Godavarman Thirumulpad v. Union of India, judgment of 28 April 2023"
        url: https://main.sci.gov.in/supremecourt/1995/2997/2997_1995_8_55_44035_Judgement_28-Apr-2023.pdf
        checked: search_excerpt
      - title: "Khaitan & Co: Supreme Court clarifies that mining in eco sensitive zone is prohibited even if its boundaries extend beyond one kilometre"
        url: https://www.mondaq.com/india/mining/1330472/supreme-court-clarifies-that-mining-in-eco-sensitive-zone-is-prohibited-even-if-its-boundaries-extend-beyond-one-kilometre
        checked: search_excerpt
    reviewed_by_svw: false
